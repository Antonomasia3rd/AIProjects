name: Build Windows binaries

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: Project to build, or All
        required: false
        default: All
        type: choice
        options:
          - All
          - AllowContentAboveLock
          - ADBController
          - YourPhoneHideBanner
          - DNSAutoUpdate
          - PhotoCollage
          - ChromeProfileCounter
          - YouTubeMusicMigrate
          - DesktopStub
          - CharmTray
          - SecureDesktopLauncher
          - TaskSchedulerMigration
      desktopstub_draft_beta:
        description: Create a draft DesktopStub beta release test (select DesktopStub)
        required: false
        default: false
        type: boolean

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-portable-layout:
    name: Test portable source contracts and TileText layout
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Configure portable tests
        run: cmake -S tools -B build/portable -DCMAKE_BUILD_TYPE=Release

      - name: Build portable tests
        run: cmake --build build/portable --parallel 2

      - name: Run portable tests
        run: ctest --test-dir build/portable --output-on-failure

  detect-projects:
    name: Detect changed projects
    runs-on: windows-2022
    outputs:
      build_all: ${{ steps.detect.outputs.build_all }}
      skip_args: ${{ steps.detect.outputs.skip_args }}
      project_list: ${{ steps.detect.outputs.project_list }}
      release_project_list: ${{ steps.detect.outputs.release_project_list }}
      release_base: ${{ steps.detect.outputs.release_base }}
      build_allow_content_above_lock: ${{ steps.detect.outputs.build_allow_content_above_lock }}
      build_adb_controller: ${{ steps.detect.outputs.build_adb_controller }}
      build_your_phone_hide_banner: ${{ steps.detect.outputs.build_your_phone_hide_banner }}
      build_dns_auto_update: ${{ steps.detect.outputs.build_dns_auto_update }}
      build_photo_collage: ${{ steps.detect.outputs.build_photo_collage }}
      build_chrome_profile_counter: ${{ steps.detect.outputs.build_chrome_profile_counter }}
      build_youtube_music_migrate: ${{ steps.detect.outputs.build_youtube_music_migrate }}
      build_desktop_stub: ${{ steps.detect.outputs.build_desktop_stub }}
      build_charm_tray: ${{ steps.detect.outputs.build_charm_tray }}
      build_secure_desktop_launcher: ${{ steps.detect.outputs.build_secure_desktop_launcher }}
      build_task_scheduler_migration: ${{ steps.detect.outputs.build_task_scheduler_migration }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Validate project map
        shell: cmd
        run: .github\scripts\Validate-ProjectMap.cmd

      - name: Validate workflow project selector
        shell: cmd
        run: .github\scripts\Test-WorkflowProjectSelection.cmd

      - name: Scan repository policy warnings
        shell: cmd
        run: .github\scripts\Invoke-PolicyWarnings.cmd

      - name: Scan README consistency warnings
        shell: cmd
        run: .github\scripts\Test-ReadmeConsistency.cmd

      - name: Detect projects to build
        id: detect
        shell: cmd
        run: >
          .github\scripts\Detect-Projects.cmd
          --event "${{ github.event_name }}"
          --manual-project "${{ github.event.inputs.project }}"
          --sha "${{ github.sha }}"
          --before "${{ github.event.before }}"
          --pull-base "${{ github.event.pull_request.base.sha }}"
          --pull-head "${{ github.event.pull_request.head.sha }}"

  build-windows:
    name: Build Windows binaries
    needs: [detect-projects, test-portable-layout]
    runs-on: windows-2022
    outputs:
      desktopstub_beta_tag: ${{ steps.desktopstub-beta.outputs.tag }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Test shared C++ baseline
        shell: cmd
        run: tools\TestSharedBaseline.cmd

      - name: Test native and managed INI interoperability
        shell: pwsh
        run: tools\TestManagedIniInteropTests.ps1 -Run

      - name: Test offscreen configuration UI and fake packaged Startup
        shell: pwsh
        run: tools\TestConfigurationFixtures.ps1 -Run

      - name: Test shared media source
        shell: cmd
        run: tools\TestSmtcSource.cmd

      - name: Test bounded HTTP fetching on localhost
        shell: cmd
        run: tools\TestHttpFetch.cmd

      - name: Test shared notes with synthetic data
        shell: cmd
        run: tools\TestNotesSource.cmd

      - name: Test source profiles and composed host with inert fixtures
        shell: pwsh
        run: tools\TestContentIntegration.ps1 -Run

      - name: Test smoke runner interruption cleanup
        shell: cmd
        run: .github\scripts\repo-tools.cmd smoke-cleanup-tests

      - name: Test shared Discord service with inert fixtures
        shell: cmd
        run: tools\TestDiscordService.cmd

      - name: Test ASUS patterns with native hardware excluded
        shell: cmd
        run: tools\TestAsusEngine.cmd

      - name: Test Caps patterns with an inert device backend
        shell: cmd
        run: tools\TestCapsBlinkEngine.cmd

      - name: Prepare reusable release versions
        if: vars.AUTO_RELEASE_ENABLED == 'true' && !contains(github.event.head_commit.message, '[ci-artifacts-only]') && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-projects.outputs.release_project_list != ''
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PROJECT_LIST: ${{ needs.detect-projects.outputs.release_project_list }}
          REPO: ${{ github.repository }}
        run: .github\scripts\Prepare-ReleaseVersions.cmd

      - name: Configure DesktopStub beta testing
        id: desktopstub-beta
        if: needs.detect-projects.outputs.build_desktop_stub == 'true' && (vars.AUTO_RELEASE_ENABLED != 'true' || contains(github.event.head_commit.message, '[ci-artifacts-only]') || inputs.desktopstub_draft_beta)
        shell: pwsh
        env:
          DRAFT_BETA: ${{ inputs.desktopstub_draft_beta }}
          SELECTED_PROJECT: ${{ inputs.project }}
        run: |
          if ($env:DRAFT_BETA -eq 'true' -and $env:SELECTED_PROJECT -ne 'DesktopStub') {
            throw 'Select DesktopStub when requesting a draft beta release test.'
          }
          $tag = 'DesktopStub-v27-beta2'
          if ($env:DRAFT_BETA -eq 'true') { $tag += '-actions-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT }
          "DESKTOPSTUB_VERSION=27.0.0.2" >> $env:GITHUB_ENV
          "DESKTOPSTUB_RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: cmd
        run: .github\scripts\build-windows.cmd ${{ needs.detect-projects.outputs.skip_args }}

      - name: Write artifact checksum summary
        shell: cmd
        run: .github\scripts\Write-ChecksumSummary.cmd

      - name: Test offline composed content independently
        if: needs.detect-projects.outputs.build_desktop_stub == 'true'
        shell: cmd
        run: .github\scripts\Smoke-WindowsBuild.cmd --projects DesktopStub --desktopstub-phase content

      - name: Run smoke tests
        shell: cmd
        run: .github\scripts\Smoke-WindowsBuild.cmd --projects "${{ needs.detect-projects.outputs.project_list }}"

      - name: Upload AllowContentAboveLock artifact
        if: needs.detect-projects.outputs.build_allow_content_above_lock == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AllowContentAboveLock
          path: |
            legacy/AllowContentAboveLock/build/AllowContentAboveLock.exe
            legacy/AllowContentAboveLock/README.md
            legacy/AllowContentAboveLock/AllowContentAboveLock.example.ini
          if-no-files-found: error

      - name: Upload ADBController artifact
        if: needs.detect-projects.outputs.build_adb_controller == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ADBController
          path: |
            legacy/ADBController/build/ADBController.exe
            legacy/ADBController/README.md
            legacy/ADBController/ADBController.example.ini
          if-no-files-found: error

      - name: Upload YourPhoneHideBanner artifact
        if: needs.detect-projects.outputs.build_your_phone_hide_banner == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: YourPhoneHideBanner
          path: |
            legacy/YourPhoneHideBanner/build/YourPhoneHideBanner.exe
            legacy/YourPhoneHideBanner/README.md
            legacy/YourPhoneHideBanner/YourPhoneHideBanner.example.ini
          if-no-files-found: error

      - name: Upload DNSAutoUpdate artifact
        if: needs.detect-projects.outputs.build_dns_auto_update == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: DNSAutoUpdate
          path: legacy/DNSAutoUpdate/build/DNSAutoUpdate.exe
          if-no-files-found: error

      - name: Upload PhotoCollage artifact
        if: needs.detect-projects.outputs.build_photo_collage == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PhotoCollage
          path: legacy/PhotoCollage/build/PhotoCollage.exe
          if-no-files-found: error

      - name: Upload ChromeProfileCounter artifact
        if: needs.detect-projects.outputs.build_chrome_profile_counter == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ChromeProfileCounter
          path: |
            legacy/ChromeProfileCounter/build/ChromeProfileCounter.exe
            legacy/ChromeProfileCounter/build/powershell_native_launcher.ps1
            legacy/ChromeProfileCounter/README.md
            legacy/ChromeProfileCounter/ChromeProfileCounter.example.ini
            legacy/ChromeProfileCounter/ChromeProfileCounter.ps1
          if-no-files-found: error

      - name: Upload YouTubeMusicMigrate artifact
        if: needs.detect-projects.outputs.build_youtube_music_migrate == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: YouTubeMusicMigrate
          path: |
            legacy/YouTubeMusicMigrate/build/YouTubeMusicMigrate.exe
            legacy/YouTubeMusicMigrate/build/youtube_music_worker_bridge.ps1
            legacy/YouTubeMusicMigrate/build/youtube_music_tidy_app.ps1
            legacy/YouTubeMusicMigrate/build/youtube_music_legacy_frontend.ps1
            legacy/YouTubeMusicMigrate/build/powershell_native_launcher.ps1
            legacy/YouTubeMusicMigrate/README.md
            legacy/YouTubeMusicMigrate/YouTubeMusicMigrate.example.ini
            legacy/YouTubeMusicMigrate/youtube_music_tidy.ps1
          if-no-files-found: error

      - name: Upload DesktopStub artifact
        if: needs.detect-projects.outputs.build_desktop_stub == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: DesktopStub
          path: |
            DesktopStub/build/DesktopStub.exe
            DesktopStub/build/DesktopStubLiveTileBroker.exe
            DesktopStub/build/DesktopStubTileLauncher.exe
          if-no-files-found: error

      - name: Upload CharmTray artifact
        if: needs.detect-projects.outputs.build_charm_tray == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: CharmTray
          path: legacy/CharmTray/build/CharmTray.exe
          if-no-files-found: error

      - name: Upload SecureDesktopLauncher artifact
        if: needs.detect-projects.outputs.build_secure_desktop_launcher == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: SecureDesktopLauncher
          path: |
            legacy/SecureDesktopLauncher/build/SecureDesktopLauncher.exe
            legacy/SecureDesktopLauncher/build/SecureDesktopPasswordLauncher.exe
            legacy/SecureDesktopLauncher/build/SecureDesktopLauncherControl.exe
            legacy/SecureDesktopLauncher/SecureDesktopLauncher.example.ini
            legacy/SecureDesktopLauncher/README.md
          if-no-files-found: error

      - name: Upload TaskSchedulerMigration artifact
        if: needs.detect-projects.outputs.build_task_scheduler_migration == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: TaskSchedulerMigration
          path: legacy/TaskSchedulerMigration/build/TaskSchedulerMigration.exe
          if-no-files-found: error

  attest-build-provenance:
    name: Attest build provenance
    if: github.event_name != 'pull_request'
    needs: build-windows
    runs-on: windows-2022
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: artifacts/**

  auto-release:
    name: Create project releases
    if: vars.AUTO_RELEASE_ENABLED == 'true' && !contains(github.event.head_commit.message, '[ci-artifacts-only]') && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-projects.outputs.release_project_list != ''
    needs:
      - detect-projects
      - build-windows
      - attest-build-provenance
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download workflow artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create or update automatic releases
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_LIST: ${{ needs.detect-projects.outputs.project_list }}
          RELEASE_PROJECT_LIST: ${{ needs.detect-projects.outputs.release_project_list }}
          REPO: ${{ github.repository }}
          FULL_SHA: ${{ github.sha }}
        run: .github\scripts\Publish-ProjectReleases.cmd -ArtifactsRoot artifacts

  desktopstub-draft-beta:
    name: Create draft DesktopStub beta release test
    if: github.event_name == 'workflow_dispatch' && inputs.desktopstub_draft_beta && inputs.project == 'DesktopStub'
    needs: [build-windows, attest-build-provenance]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download verified DesktopStub payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: DesktopStub
          path: payload
      - name: Create draft prerelease without publishing or overwriting
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ needs.build-windows.outputs.desktopstub_beta_tag }}
        run: |
          if ($env:BETA_TAG -notmatch '^DesktopStub-v27-beta2-actions-[0-9]+-[0-9]+$') { throw 'Unexpected beta test tag.' }
          $files = @('DesktopStub.exe','DesktopStubLiveTileBroker.exe','DesktopStubTileLauncher.exe') | ForEach-Object {
            $file = Get-Item -LiteralPath (Join-Path 'payload' $_) -ErrorAction Stop
            if ($file.VersionInfo.FileVersion -ne '27.0.0.2') { throw ('Unexpected beta FileVersion: ' + $file.Name) }
            $file.FullName
          }
          $files | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + [IO.Path]::GetFileName($_) } | Set-Content -LiteralPath payload/SHA256SUMS.txt
          $notes = 'Draft-only GitHub Actions beta test. Source commit: ' + $env:GITHUB_SHA + '. Not a stable release; no installed settings or accounts are included.'
          $notes | Set-Content -LiteralPath payload/release-notes.txt
          & gh release create $env:BETA_TAG @files payload/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $env:BETA_TAG --notes-file payload/release-notes.txt --draft --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Draft prerelease creation failed; no existing release was edited or deleted.' }
