; The controller edits this profile. Native actions use the selected helper's
; sibling INI; an alternate --ini is a draft, not automatic deployment.
[Control]
RunAtStartup=0
ServiceExecutable=SecureDesktopLauncher.exe
PasswordExecutable=SecureDesktopPasswordLauncher.exe
PasswordIniPath=SecureDesktopPasswordLauncher.ini

[General]
Desktop=WinSta0\Winlogon
LaunchSpacingMs=3000
MaxProgramsPerSession=0
StopOnServiceStop=1
StartOnServiceStart=1
StartOnConsoleConnect=1
StartOnRemoteConnect=1
StartOnLogon=1
StartOnLock=1
StartOnUnlock=1
LaunchDisconnectedSessions=1
IncludeUsers=
ExcludeUsers=

[Program:Example]
Enabled=0
Path=C:\Program Files\Example\Example.exe
Arguments=
CommandLine=
PreventDuplicate=1
ShowWindow=4
; WorkingDirectory, Desktop, LaunchSpacingMs and StopOnServiceStop inherit
; native defaults until explicitly set for this program.
